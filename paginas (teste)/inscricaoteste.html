<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição | Oficina</title>
  </head>
  <body>
    <header>
      <h1>Inscrição na Oficina de Robótica</h1>
    </header>

    <nav>
      <ul>
        <li><a href="oficinas.html">Oficina Robótica</a></li>
      </ul>
    </nav>

        <main>
      <h2>Formulário de inscrição</h2>
      <p>Preenche os dados para escolheres uma oficina da Techland.</p>

      <form action="inscricao.html" method="get">
       <p><label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" required></form></p>
        <p></p><label for="email">Email *</label>
        <input type="email" id="email" name="email" required></p>
        <p><label for="oficina">Escolhe uma oficina *</label>
        <select id="oficina" name="oficina" required><br></p>
          <option value="robotica">Robótica</option>
        </select>
                <p><label for="mensagem">Mensagem (opcional)</label>
        <textarea id="mensagem" name="mensagem"></textarea></p>
                <button type="submit">Inscrever</button>
</form>
    </main>

    <footer>
      <p>Inscricao</p>
    </footer>
  </body>
</html>
