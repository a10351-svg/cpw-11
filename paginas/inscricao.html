
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição | Techland</title>
</head>
<body>
    <header>
        <h1>Techland</h1>
        <nav>
          <ul>
        <li><a href="../index.html">Início</a></li>
        <li><a href="atividades.html">Atividades</a></li>
        <li><a href="galeria.html">Galeria</a></li>
          </ul>
        </nav>
    </header>

    <main>
        <h2>Formulário de inscrição</h2>
        <p>Preenche os dados para escolheres uma oficina da Techland.</p>

        <form action="inscricao.html" method="get">
            <p>
                <label for="nome">Nome *</label>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="oficina">Escolhe uma oficina *</label>
                <select id="oficina" name="oficina" required>
                    <option value="">Escolhe uma oficina</option>
                    <option value="paginas-web">Páginas web</option>
                    <option value="robotica">Robótica</option>
                    <option value="jogos">Jogos</option>
                </select>
            </p>

            <p>
                <label for="mensagem">Mensagem (opcional)</label>
                <textarea id="mensagem" name="mensagem"></textarea>
            </p>

            <button type="submit">Testar inscrição</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Techland</p>
        <p><a href="../index.html">Voltar à página inicial</a></p>
    </footer>
</body>
</html>
